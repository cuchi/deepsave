services:
  postgres:
    image: postgres:16-alpine
    container_name: deepsave-postgres
    environment:
      POSTGRES_USER: deepsave
      POSTGRES_PASSWORD: deepsave
      POSTGRES_DB: deepsave
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepsave -d deepsave"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: deepsave-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://deepsave:deepsave@postgres:5432/deepsave
      PORT: "8080"
      STATIC_DIR: /app/dist
      SESSION_SECRET: deepsave-dev-secret-change-me-0123456789
      APP_PASSWORD: deepsave
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # DEEPSEEK_BASE_URL: https://api.deepseek.com
    ports:
      - "8080:8080"
    volumes:
      - appdata:/app/storage

volumes:
  pgdata:
  appdata:
